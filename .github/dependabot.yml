# weekly bumps. prefixes keep dependabot's commits and pr titles conventional (commits.yml).
version: 2
updates:
  # actions are pinned by sha; dependabot moves the sha and the version comment together
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']

  # build.gradle.kts
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  # commitlint, husky, prettier
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      tooling:
        patterns: ['*']
